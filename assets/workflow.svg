  <path d="M506.2,302.3 L513.1,309.7 L507.6,319.9 L497.6,318.0 L488.6,325.9 L489.2,336.0 L478.4,340.2 L472.0,332.4 L460.0,332.7 L454.0,340.8 L443.0,337.1 L443.1,327.0 L433.7,319.5 L423.9,321.8 L417.9,311.9 L424.4,304.2 L422.1,292.5 L413.0,288.0 L414.8,276.5 L424.8,274.8 L430.5,264.3 L426.5,255.0 L435.2,247.4 L443.9,252.5 L455.1,248.2 L458.0,238.5 L469.6,238.2 L472.9,247.7 L484.3,251.6 L492.7,246.0 L501.8,253.3 L498.3,262.7 L504.5,273.0 L514.5,274.1 L516.8,285.5 L508.0,290.5 Z M440.0,290.0 a25,25 0 1,0 50,0 a25,25 0 1,0 -50,0 Z" fill="#FF9F66" fill-rule="evenodd" stroke="#FFCDB2" stroke-width="4" paint-order="stroke"/>

  <!-- agent-worker -->
  <rect x="705" y="170" width="243" height="238" rx="24" fill="#FFCDB2"/>
  <text x="826" y="206" class="card">agent-worker</text>
  <!-- robot -->
  <line x1="834" y1="282" x2="834" y2="304" stroke="#B8734A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="834" cy="282" r="10" fill="#B8734A"/>
  <rect x="738" y="302" width="117" height="79" rx="16" fill="#B8734A"/>
  <circle cx="765" cy="327" r="14" fill="#FF9F66"/>
  <circle cx="831" cy="327" r="14" fill="#FF9F66"/>
  <rect x="768" y="358" width="48" height="18" rx="7" fill="#FF9F66"/>
  <!-- bulle -->
  <path d="M870,263 H917 Q925,263 925,271 V299 Q925,307 917,307 H889 L876,318 V307 H870 Q862,307 862,299 V271 Q862,263 870,263 Z" fill="#FFA566"/>

  <!-- flèche agent-loop -> agent-worker -->
  <path d="M566 289 H672" class="dash" stroke="url(#gLoop)"/>
  <path d="M672 273 L695 289 L672 305 Z" fill="url(#gLoop)" stroke="url(#gLoop)" stroke-width="6" stroke-linejoin="round"/>

  <!-- flèche MCPs -> agent-loop -->
  <path d="M637 564 V546 Q637 533 624 533 H457 Q444 533 444 520 V462" class="dash" stroke="url(#gMcp)"/>
  <path d="M428 456 L444 434 L460 456 Z" fill="url(#gMcp)" stroke="url(#gMcp)" stroke-width="6" stroke-linejoin="round"/>

  <!-- ================= MCPs ================= -->
  <rect x="132" y="564" width="1010" height="446" rx="32" fill="#FDE1F0"/>
  <text x="637" y="608" class="title">MCPs</text>

  <rect x="215" y="659" width="243" height="72" rx="20" fill="#F2C4FA"/><text x="336.5" y="695.0" class="chip" fill="#000">LMMS</text>
  <rect x="515" y="659" width="243" height="72" rx="20" fill="#FFC3DD"/><text x="636.5" y="695.0" class="chip" fill="#000">project-navigator</text>
  <rect x="815" y="659" width="243" height="72" rx="20" fill="#FFC3D4"/><text x="936.5" y="695.0" class="chip" fill="#000">web-search</text>
  <rect x="215" y="767" width="243" height="72" rx="20" fill="#F7D5F5"/><text x="336.5" y="803.0" class="chip" fill="#8C7B8E">Blender</text>
  <rect x="515" y="767" width="243" height="72" rx="20" fill="#FFC3E3"/><text x="636.5" y="803.0" class="chip" fill="#000">project-writer</text>
  <rect x="815" y="767" width="243" height="72" rx="20" fill="#FFC3D4"/><text x="936.5" y="803.0" class="chip" fill="#000">skills-connector</text>
  <rect x="515" y="874" width="243" height="72" rx="20" fill="#FFC2E5"/><text x="636.5" y="910.0" class="chip" fill="#000">git</text>

  <!-- ================= Skills ================= -->
  <rect x="1224" y="564" width="562" height="446" rx="32" fill="#E4FFDB"/>
  <text x="1505" y="608" class="title">Skills</text>

  <rect x="1384" y="659" width="243" height="72" rx="20" fill="#B9E6A8"/><text x="1505.5" y="695.0" class="chip" fill="#000">sandbox-usage</text>
  <rect x="1384" y="767" width="243" height="72" rx="20" fill="#B9E6A8"/><text x="1505.5" y="803.0" class="chip" fill="#000">coding-style</text>
  <rect x="1384" y="874" width="243" height="72" rx="20" fill="#B9E6A8"/><text x="1505.5" y="910.0" class="chip" fill="#000">symbolic-maths</text>

  <!-- connecteurs Skills -> skills-connector -->
  <path d="M1384 695 H1195 Q1182 695 1182 708 V897 Q1182 910 1195 910 H1384" class="dash" stroke="url(#gSkills)"/>
  <path d="M1384 803 H1098" class="dash" stroke="url(#gSkills)"/>
  <path d="M1098 787 L1072 803 L1098 819 Z" fill="url(#gSkills)" stroke="url(#gSkills)" stroke-width="6" stroke-linejoin="round"/>
</svg>
