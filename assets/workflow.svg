<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;display=swap');
      text { font-family: Poppins, 'Segoe UI', Arial, sans-serif; font-weight: 600; text-anchor: middle; }
      .title { font-size: 29px; font-weight: 700; dominant-baseline: central; fill: #000; }
      .card { font-size: 22px; font-weight: 700; dominant-baseline: central; fill: #000; }
      .chip { font-size: 22px; font-weight: 600; dominant-baseline: central; }
      .dash { fill: none; stroke-width: 7; stroke-dasharray: 22 12; stroke-linecap: butt; stroke-linejoin: round; }
    </style>
    <!-- Dégradés : couleur de la boîte de départ -> couleur de la boîte d'arrivée -->
    <!-- panneau MCPs (#FDE1F0) -> carte agent-loop (#FFCDB2) -->
    <linearGradient id="gMcp" gradientUnits="userSpaceOnUse" x1="637" y1="564" x2="444" y2="432">
      <stop offset="0" stop-color="#FDE1F0"/>
      <stop offset="1" stop-color="#FFCDB2"/>
    </linearGradient>
    <!-- carte agent-loop (#FFCDB2) -> carte agent-worker (#FFCDB2) -->
    <linearGradient id="gLoop" gradientUnits="userSpaceOnUse" x1="566" y1="289" x2="695" y2="289">
      <stop offset="0" stop-color="#FFCDB2"/>
      <stop offset="1" stop-color="#FFCDB2"/>
    </linearGradient>
    <!-- chips Skills (#B9E6A8) -> chip skills-connector (#FFC3D4) -->
    <linearGradient id="gSkills" gradientUnits="userSpaceOnUse" x1="1384" y1="0" x2="1072" y2="0">
      <stop offset="0" stop-color="#B9E6A8"/>
      <stop offset="1" stop-color="#FFC3D4"/>
    </linearGradient>
  </defs>

  <!-- Fond + cadre sombre -->
  <rect width="1920" height="1080" fill="#1e1e1e"/>
  <rect x="8" y="3" width="1902" height="1069" fill="#ffffff"/>

  <!-- ================= APIs ================= -->
  <rect x="132" y="67" width="1010" height="445" rx="32" fill="#FFE4D6"/>
  <text x="637" y="111" class="title">APIs</text>

  <!-- agent-loop -->
  <rect x="322" y="170" width="243" height="238" rx="24" fill="#FFCDB2"/>
  <text x="443" y="206" class="card">agent-loop</text>
